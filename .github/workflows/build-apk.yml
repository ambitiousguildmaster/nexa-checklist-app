name: Build NEXA APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Copy APK
        run: cp build/app/outputs/flutter-apk/app-release.apk NEXA-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-release
          path: NEXA-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexa-${{ github.run_number }}
          name: NEXA APK ${{ github.run_number }}
          files: NEXA-release.apk
          generate_release_notes: true
